[package]
name = "ahc070"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
publish = false

# 各コンテストを独立したCargo workspaceにし、targetと依存関係を閉じ込める。
[workspace]
exclude = ["tools"]

[dependencies]
itertools = "0.14"
proconio = { version = "0.5", features = ["derive"] }
rand = "=0.9.2"
rand_pcg = "=0.9.0"

[profile.release]
debug = 1
overflow-checks = true
